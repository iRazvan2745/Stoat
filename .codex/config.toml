[mcp_servers.better-t-stack]
command = "pnpm"
args = ["dlx", "create-better-t-stack@latest", "mcp"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.svelte]
type = "http"
url = "https://mcp.svelte.dev/mcp"

[mcp_servers.better-auth]
type = "http"
url = "https://mcp.better-auth.com/mcp"
