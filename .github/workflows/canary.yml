name: Canary Stoat and sidecar release

on:
    workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ghcr.io/irazvan2745/sidecar
    APP_IMAGE_NAME: ghcr.io/irazvan2745/stoat

jobs:
    canary-release:
        name: Create canary release
        runs-on: ubuntu-latest
        outputs:
            canary_version: ${{ steps.calc_version.outputs.version }}
            root_version: ${{ steps.calc_version.outputs.root_version }}
        steps:
            - name: Check out Stoat
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Calculate canary version
              id: calc_version
              run: |
                  CURRENT_VERSION=$(jq -r '.version' package.json)
                  echo "Current base version: $CURRENT_VERSION"
                  echo "root_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

                  CLEAN_VERSION="${CURRENT_VERSION%%-*}"
                  IFS='.' read -r -a parts <<< "$CLEAN_VERSION"
                  MAJOR=${parts[0]}
                  MINOR=${parts[1]}
                  PATCH=${parts[2]}
                  NEXT_PATCH=$((PATCH + 1))
                  NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH"

                  LAST_CANARY=$(git tag -l "v$NEXT_VERSION-canary.*" | sort -V | tail -n 1)
                  if [ -z "$LAST_CANARY" ]; then
                      NEXT_NUM=1
                  else
                      LAST_NUM=$(echo "$LAST_CANARY" | awk -F. '{print $NF}')
                      NEXT_NUM=$((LAST_NUM + 1))
                  fi

                  NEW_VERSION="$NEXT_VERSION-canary.$NEXT_NUM"
                  echo "Next canary version: $NEW_VERSION"
                  echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

            - name: Push canary tag
              run: |
                  git config --global user.name 'github-actions[bot]'
                  git config --global user.email 'github-actions[bot]@users.noreply.github.com'

                  TAG="v${{ steps.calc_version.outputs.version }}"
                  git tag "$TAG"
                  git push origin "$TAG"

            - name: Create GitHub canary release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.calc_version.outputs.version }}
                  name: v${{ steps.calc_version.outputs.version }}
                  generate_release_notes: true
                  make_latest: false
                  prerelease: true

    publish-docker:
        name: Publish canary images
        needs: canary-release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out canary tag
              uses: actions/checkout@v4
              with:
                  ref: v${{ needs.canary-release.outputs.canary_version }}

            - name: Sidecar Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ needs.canary-release.outputs.root_version }}
                      type=raw,value=${{ needs.canary-release.outputs.canary_version }}
                      type=raw,value=canary

            - name: Stoat Docker metadata
              id: app-meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.APP_IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ needs.canary-release.outputs.root_version }}
                      type=raw,value=${{ needs.canary-release.outputs.canary_version }}
                      type=raw,value=canary

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push sidecar canary image
              uses: docker/build-push-action@v6
              with:
                  context: sidecar
                  file: sidecar/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            - name: Build and push Stoat canary image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ${{ steps.app-meta.outputs.tags }}
                  labels: ${{ steps.app-meta.outputs.labels }}
