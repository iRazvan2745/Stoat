name: Release Stoat and sidecar images

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ghcr.io/irazvan2745/sidecar
    APP_IMAGE_NAME: ghcr.io/irazvan2745/stoat

jobs:
    release:
        name: Release Stoat and sidecar
        if: ${{ !contains(github.ref_name, '-canary.') }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out Stoat
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract version
              id: version
              run: |
                  ROOT_VERSION=$(jq -r '.version' package.json)
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  if [ "$ROOT_VERSION" != "$TAG_VERSION" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $ROOT_VERSION"
                      exit 1
                  fi
                  echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: true

            - name: Sidecar Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
                      type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
                      type=raw,value=latest

            - name: Stoat Docker metadata
              id: app-meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.APP_IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
                      type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
                      type=raw,value=latest

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push sidecar image
              uses: docker/build-push-action@v6
              with:
                  context: sidecar
                  file: sidecar/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            - name: Build and push Stoat image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ${{ steps.app-meta.outputs.tags }}
                  labels: ${{ steps.app-meta.outputs.labels }}
